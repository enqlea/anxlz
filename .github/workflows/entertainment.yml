# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Entertainment Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  entertainment:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Entertainment Metric - YouTube, Chess, AniList
      - name: Entertainment Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: entertainment.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: anxlz
          template: classic
          base: ""
          config_octicon: yes
          config_timezone: Africa/Cairo
          config_twemoji: yes
          output_action: gist
          committer_gist: ${{ secrets.GIST }}
          
          plugin_anilist: yes
          plugin_anilist_limit: 10
          plugin_anilist_limit_characters: 22
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters
          plugin_anilist_shuffle: yes
          plugin_anilist_user: anxlz

          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_playlist: https://open.spotify.com/embed/album/1AvZnGEW0QnxVfSaPmavoN?utm_source=generator&si=60a5daca0d15490d
          
          plugin_chess: yes
          plugin_chess_token: ${{ secrets.CHESS_TOKEN }}
          plugin_chess_platform: lichess.org
